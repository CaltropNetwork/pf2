<!DOCTYPE html>

<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Pre-Fortress 2 Map List</title>
    <style>
      /* Small layout tweaks so the search sits nicely at the top */
      header {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin: 1rem 0;
      }
      #search {
        flex: 1;
        max-width: 560px;
      }
      ul {
        padding-left: 1rem;
      }
    </style>
  </head>

  <body>
    <h1>Pre-Fortress 2 Map List</h1>
    <br />
    <noscript
      ><b
        >This page requires JavaScript to display the file list. Since you don't
        have JavaScript, you can go
        <a
          href="https://github.com/CaltropNetwork/pf2/tree/main/maps"
          target="_blank"
          rel="noopener noreferrer"
          >here</a
        >
        instead.</b
      ></noscript
    >
    <input
      id="search"
      type="search"
      placeholder="🔍 Search files..."
      aria-label="Search files"
    /><br />

    <div id="list">Loading...</div>

    <div id="list"></div>
    <script src="maps.js"></script>
  </body>
</html>
